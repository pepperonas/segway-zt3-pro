[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zt3-cli"
version = "0.1.0"
description = "Mac/Linux CLI for direct BLE access to a Segway-Ninebot ZT3 Pro D"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Martin Pfeffer" }]
license = { text = "Proprietary" }
dependencies = [
    "bleak>=0.22.0",
    "pycryptodome>=3.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
zt3 = "zt3_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["zt3_cli"]
